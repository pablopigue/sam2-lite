# Lint + tests on every push and pull request. The tests need no dataset, checkpoint or GPU
# (random weights or fake trackers), so they run on a standard CPU runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # the workflow only reads the code

concurrency:  # a newer push to the same branch cancels the run in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (with a cache of downloaded packages, keyed on uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0 (pinned: no major tags after v7)
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ffmpeg (H.264 tests; skipped without it)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install the locked environment (same versions as local; fails if uv.lock is stale)
        run: uv sync --locked --group api

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Model quality, not just code: the released tracker (bundle + ONNX encoder, CPU) must not
  # regress on 3 DAVIS val videos (configs/eval_gate.yaml, D-050). Only on pushes to main, where
  # the HF_TOKEN secret (read-only token for the private model repo) is available.
  eval-gate:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: uv sync --locked

      - name: Cache the DAVIS val videos used by the gate
        id: davis
        uses: actions/cache@v6
        with:
          path: data/raw/DAVIS
          key: davis2017-480p-${{ hashFiles('configs/eval_gate.yaml') }}

      - name: Download them from the official site (only on a cache miss; not redistributed)
        if: steps.davis.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/davis.zip" \
            https://data.vision.ee.ethz.ch/csergi/share/davis/DAVIS-2017-trainval-480p.zip
          videos=$(uv run python -c "from omegaconf import OmegaConf; \
            print(' '.join(OmegaConf.load('configs/eval_gate.yaml').ci.videos))")
          mkdir -p data/raw
          for v in $videos; do
            unzip -q "$RUNNER_TEMP/davis.zip" "DAVIS/JPEGImages/480p/$v/*" \
              "DAVIS/Annotations/480p/$v/*" -d data/raw
          done

      - name: Eval gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make gate
