# Click-to-track demo (app/app.py, src/sam2lite/demo.py).
# The limits keep a 2-core CPU responsive: ~36 frames at ~0.35 s/frame (mobile) or
# ~1.9 s/frame (sam2-lite) with 2 threads.

repo_id: Pablopigue/sam2-lite
local_bundle: checkpoints/bundle/sam2-lite   # used instead of the Hub if it exists (local dev)
local_onnx_dir: checkpoints/onnx

models:                          # same weights, two input resolutions
  sam2-lite-mobile: {image_size: 576, onnx: student_encoder_r576.onnx}
  sam2-lite: {image_size: 1024, onnx: student_encoder_r1024.onnx}
default_model: sam2-lite-mobile

max_seconds: 6                   # longer uploads are cut
target_fps: 6                    # frames are subsampled to about this rate before tracking
max_side: 854                    # longer side of the frames (480p width); bigger uploads are downscaled
threads: 2                       # torch + ONNX Runtime threads (a modest 2-core CPU)

# Headline numbers shown in the app header, copied from MLflow.
stats:
  speedup_cpu: "2.13×"          # pipeline, CPU 6 threads: a0b4ebcc / a384f235
  jf_lite: "84.4"               # DAVIS 2017 val J&F: 62e59f5e
  jf_teacher: "89.1"            # b44efdd1
  jf_mobile: "77.1"             # ca473c99
  mobile_ms: "398"              # sam2-lite-mobile, CPU 2 threads: b205e7be
  encoder_params: "7.5M"        # vs 27.2M for Hiera-T: a384f235 / a0b4ebcc
links:
  github: https://github.com/pablopigue/sam2-lite
  model: https://huggingface.co/Pablopigue/sam2-lite

# Example videos (scripts/fetch_examples.py): explicit CC0 / CC BY licence on Wikimedia Commons,
# cut and re-encoded small enough for git (< 1 MB); attribution in app/examples/ATTRIBUTION.md.
# clicks: [obj_id, x, y, label] on the first frame. hard: the honest failure case, shown with a
# precomputed teacher-vs-student comparison (scripts/precompute_comparison.py).
examples:
  dir: app/examples
  seconds: 5
  height: 480
  videos:
    - {name: train-viaduct, title: "Train passes over Kilnap Viaduct, Cork City, Ireland.webm", start: 1.5, clicks: [[1, 350, 205, 1]], hard: true}  # cut at 7.96 s
    - {name: swans, title: "Trumpeter swan family.webm", start: 4, clicks: [[1, 660, 225, 1]]}
