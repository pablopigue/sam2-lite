# Click-to-track demo (app/app.py, src/sam2lite/demo.py).
# The limits keep a free CPU Space (2 vCPU) responsive: ~0.4 s/frame for sam2-lite-mobile and
# ~2.1 s/frame for sam2-lite with 2 threads (D-040).

repo_id: Pablopigue/sam2-lite   # private for now: needs HF_TOKEN (Space secret or .env)
local_bundle: checkpoints/bundle/sam2-lite   # used instead of the Hub if it exists (local dev)
local_onnx_dir: checkpoints/onnx

models:                          # same weights, two input resolutions (D-034, D-041)
  sam2-lite-mobile: {image_size: 576, onnx: student_encoder_r576.onnx}
  sam2-lite: {image_size: 1024, onnx: student_encoder_r1024.onnx}
default_model: sam2-lite-mobile

max_seconds: 10                  # longer uploads are cut
target_fps: 8                    # frames are subsampled to about this rate before tracking
max_side: 854                    # longer side of the frames (480p width); bigger uploads are downscaled
threads: 2                       # torch + ONNX Runtime threads (= free Space vCPUs)
max_objects: 3                   # each extra object adds a memory attention + decoder pass per frame

# Headline numbers shown in the app header, copied from MLflow (run ids next to each value,
# all git_dirty=False; same values as the model card).
stats:
  speedup_cpu: "2.13×"          # pipeline, CPU 6 threads: a0b4ebcc / a384f235
  jf_lite: "84.4"               # DAVIS 2017 val J&F: 62e59f5e
  jf_teacher: "89.1"            # b44efdd1
  jf_mobile: "77.1"             # ca473c99
  mobile_ms: "398"              # sam2-lite-mobile, CPU 2 threads: b205e7be
  encoder_params: "7.5M"        # vs 27.2M for Hiera-T: a384f235 / a0b4ebcc
links:
  github: https://github.com/pablopigue/sam2-lite
  model: https://huggingface.co/Pablopigue/sam2-lite

# Example videos (scripts/fetch_examples.py): explicit CC0 / CC BY licence on Wikimedia Commons,
# cut and re-encoded small enough for git (< 1 MB); attribution in app/examples/ATTRIBUTION.md.
examples:
  dir: app/examples
  seconds: 8
  height: 480
  videos:
    - {name: train-river, title: "T3 Train Crossing Cooks River.webm", start: 3.5, point: [330, 240]}
    - {name: train-viaduct, title: "Train passes over Kilnap Viaduct, Cork City, Ireland.webm", start: 1.5, seconds: 6.3, point: [350, 205]}  # scene cut at 7.96 s
    - {name: swans, title: "Trumpeter swan family.webm", start: 4, point: [660, 230]}
