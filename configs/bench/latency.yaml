# Per-frame latency of the image encoder alone and of the full video pipeline.
# Override from the CLI, e.g.:  devices=[cpu] cpu_threads=[2] iters.cpu=5

model:
  name: teacher             # teacher | student
  config: configs/sam2.1/sam2.1_hiera_t.yaml
  checkpoint: checkpoints/sam2.1_hiera_tiny.pt
  ckpt: null                # student only: distillation checkpoint (best.pt)
  onnx: null                # student only: ONNX encoder (make export), CPU
student_config: configs/model/student_mnv4.yaml
memory_frames: null          # Plan C1: number of memory frames (null = SAM 2.1's 7)
memory_ckpt: null            # Plan C2: fine-tuned memory attention (best.pt), needs memory_frames
memory_stride: null          # older memory frames every r-th frame (null = 1, the most recent)

# Same predictor settings as the evaluation (configs/eval/davis_val.yaml).
apply_postprocessing: false
non_overlap_masks: true

devices: [cuda, cpu]
# i7-13620H: 6 performance cores (12 threads) + 4 efficiency cores. 6 threads keeps the work on
# the P-cores; 2 threads approximates a modest 2-core machine (e.g. a 2-vCPU CPU Space).
cpu_threads: [6, 2]

image_size: 1024              # model input resolution (mobile model: 512)
# The pipeline is timed frame by frame on a real video. The first frames are warmup: besides the
# usual one-off costs, the memory bank fills up during the first num_maskmem (= 7) frames.
davis_root: data/raw/DAVIS
pipeline_video: cows      # longest val video (104 frames): room for warmup + iters + 1
warmup: 10
iters:
  cuda: 50
  cpu: 20
