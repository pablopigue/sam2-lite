# Hugging Face Space for the demo (scripts/build_space.py), on ZeroGPU: the account's only
# cpu-basic slot is used by another Space.

repo_id: Pablopigue/sam2-lite-demo
private: true
hardware: zero-a10g
out_dir: outputs/hf/space        # staging folder, reviewed before --push
variables: {SAM2LITE_DEVICE: cuda}   # the app's GPU path: PyTorch encoder inside @spaces.GPU

readme:
  title: sam2-lite
  emoji: 🎯
  colorFrom: indigo
  colorTo: purple
  sdk: gradio
  sdk_version: 6.29.1            # the version tested locally (uv.lock)
  python_version: "3.10"         # what ZeroGPU images run (the project itself uses 3.11)
  app_file: app/app.py
  license: apache-2.0
  short_description: Distilled SAM 2.1 video object tracking, faster on CPU
  models: [Pablopigue/sam2-lite]
  pinned: false

# Python packages for the Space.
requirements:
  - torch==2.13.0
  - torchvision==0.28.0
  - sam-2 @ git+https://github.com/facebookresearch/sam2@2b90b9f5ceec907a1c18123530e92e794ad901a4
  - timm==1.0.30
  - omegaconf==2.3.1
  - huggingface_hub==2.0.0
  - safetensors==0.8.0
  - onnxruntime==1.23.2          # last release for Python 3.10; imported, unused on the GPU path
  - opencv-python-headless==5.0.0.93
  - spaces==0.51.3               # @spaces.GPU is a no-op off ZeroGPU, but app.py imports it
packages: [ffmpeg]               # apt packages: H.264 encoding for the browser
