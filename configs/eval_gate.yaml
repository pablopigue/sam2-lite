# Acceptance thresholds, fixed BEFORE the final results.
# Decided on principle (quality/speed trade-off), not tuned to make the student pass.

teacher:
  jf_davis_val: 89.1          # MLflow run b44efdd1 (SAM 2.1 Hiera-T, DAVIS 2017 val, 30 videos)

quality:
  max_jf_drop: 5.0            # student J&F >= teacher - 5.0 = 84.1 on DAVIS 2017 val (full)

speed:                         # measured locally with configs/bench/latency.yaml, never in CI
  min_pipeline_speedup_cpu6t: 1.25   # teacher / student median ms per frame, full pipeline, 6 threads

# CI eval gate: CI checks that a change does not make the champion worse on these videos.
ci:
  videos: [judo, car-shadow, motocross-jump]   # the 3 shortest val videos with 1+ objects (114 frames)
  model_repo: Pablopigue/sam2-lite             # bundle + ONNX, downloaded with HF_TOKEN in CI
  local_bundle: checkpoints/bundle/sam2-lite   # used instead when it exists (local runs)
  local_onnx: checkpoints/onnx/student_encoder_r1024.onnx
  onnx_file: student_encoder_r1024.onnx        # sam2-lite @1024, CPU + ONNX Runtime (deployment)
  reference_jf: 81.80        # champion on these videos: MLflow run 45391c03 (git_dirty=False)
  tolerance: 1.0             # numeric noise across CPUs/ONNX kernels is ~0.01; a real break costs more
  teacher_jf: 90.73          # for context only: MLflow run 1568b8af

# Mobile / low-resource model (sam2-lite-mobile), fixed BEFORE any result at reduced resolution.
# Measured on the laptop CPU with 2 threads (a modest 2-core machine).
mobile:
  min_jf: 80.0                       # DAVIS 2017 val (full)
  max_pipeline_ms_cpu2t: 600.0       # median ms per frame, full pipeline, configs/bench/latency.yaml
