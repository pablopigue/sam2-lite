[project]
name = "sam2lite"
version = "0.1.0"
description = "Faster SAM 2.1 on CPU by distilling its image encoder into a mobile backbone"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "pablopigue", email = "pablopigueesp@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "sam-2",
    "setuptools>=61",        # sam-2's build backend (built without isolation, see below)
    "timm",
    "opencv-python",
    "omegaconf",
    "mlflow",
    "scikit-image>=0.26.0",
    "onnxruntime>=1.30.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=2.0.0",
]

[dependency-groups]
app = [
    "gradio>=6.29.1",
    "spaces>=0.51.3",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "onnx>=1.23.1",
    "onnxscript>=0.7.2",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

# --- PyTorch CUDA 13.0 wheels (driver supports up to 13.0) ---
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true              # only torch/torchvision come from here

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
sam-2 = { git = "https://github.com/facebookresearch/sam2", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

# --- Build sam-2 against our torch, without its optional CUDA extension ---
[tool.uv]
no-build-isolation-package = ["sam-2"]

[[tool.uv.dependency-metadata]]
name = "sam-2"
version = "1.0"
requires-dist = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=1.24.4",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
]

[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "0" }

# --- Lint / format ---
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/sam2lite/eval/third_party"]  # vendored code, kept byte-identical
force-exclude = true  # also honour the exclusion when pre-commit passes file names explicitly

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# --- Tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
